# Stages the tagged version on npm through trusted publishing.
# Setup and approval are described in docs/maintaining.md.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Refuse a tag that does not match the version
        run: |
          manifest="$(node -p "require('./package.json').version")"
          lock="$(node -p "require('./package-lock.json').version")"
          lock_root="$(node -p \
            "require('./package-lock.json').packages[''].version")"
          if [[ "v${manifest}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} is not package.json v${manifest}"
            exit 1
          fi
          if [[ "${lock}" != "${manifest}" ]] \
            || [[ "${lock_root}" != "${manifest}" ]]; then
            echo "package-lock.json has ${lock} and ${lock_root}," \
              "package.json has ${manifest}"
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Skip a version that is already on npm
        id: published
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already on npm; nothing to stage."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.skip != 'true'
        run: npm stage publish
